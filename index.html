<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Database Adventure</title>
<style>
:root{--bg:#f4f2ff;--c:#fff;--t:#1b1840;--m:#625f8a;--p:#5b3fd9;--b:#2563eb;--bd:#d9d4f5;--ok:#0f8a4f;--no:#c5281c;--okb:#e2f6ea;--nob:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12102a;--c:#1e1b42;--t:#eeecff;--m:#a9a6d6;--p:#9d86ff;--b:#6ea0ff;--bd:#38346e;--ok:#4fd18b;--no:#ff8a80;--okb:#14352a;--nob:#3b1b22}}
:root[data-theme=dark]{--bg:#12102a;--c:#1e1b42;--t:#eeecff;--m:#a9a6d6;--p:#9d86ff;--b:#6ea0ff;--bd:#38346e;--ok:#4fd18b;--no:#ff8a80;--okb:#14352a;--nob:#3b1b22}

nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px}nav button{flex:none;border:1px solid var(--bd);background:var(--c);color:var(--t);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:14px}nav button.on{background:var(--p);color:#fff;border-color:var(--p)}
main{max-width:820px;margin:0 auto;padding:12px;animation:f .4s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
h1,h2,h3{margin:.3em 0}.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.hero{background:linear-gradient(135deg,#2563eb,#6d3fe0);color:#fff;border-radius:18px;padding:22px;text-align:center}.hero .pc{font-size:56px;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.btn{background:linear-gradient(90deg,var(--b),var(--p));color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;margin:4px 4px 4px 0}.btn.g{background:var(--c);color:var(--p);border:1px solid var(--p)}

</style></head><body>
<div id="hud"><b>🧠 Database Adventure</b> · ⭐ <span id="pt">0</span> poin · Misi selesai: <span id="dn">0</span>/5<div class="bar"><i id="pb"></i></div></div>
<nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),S={pts:{},q:{},h:{},pz:{}},QS={};
const A=(id,p)=>{if(!S.pts[id]){S.pts[id]=p;hud()}},sum=p=>Object.entries(S.pts).filter(([k])=>k.startsWith(p)).reduce((a,[,v])=>a+v,0);
const DN=()=>({m1:sum('m1')>=30,m2:sum('m2')>=30,m3:sum('m3')>=30,m4:sum('m4')>=80,m5:sum('m5')>=30});
function hud(){const d=Object.values(DN()).filter(x=>x).length;$('#pt').textContent=sum('');$('#dn').textContent=d;$('#pb').style.width=d*20+'%'}
const NV=['🏠 Mulai','1 Detektif','2 Struktur','3 SQL','4 Lab','5 Proyek','🏆 Kuis','✍️ Refleksi','👩‍🏫 Guru'];
$('#nav').innerHTML=NV.map((n,i)=>`<button onclick="go(${i})">${n}</button>`).join('');
const NX=(i)=>`<div class=card>${i>0?`<button class="btn g" onclick="go(${i-1})">← Kembali</button>`:''}<button class=btn onclick="go(${i+1})">Lanjut →</button></div>`;
function go(i){[...document.querySelectorAll('nav button')].forEach((b,k)=>b.classList.toggle('on',k==i));$('#app').innerHTML=P[i]();$('#app').style.animation='none';$('#app').offsetWidth;$('#app').style.animation='';scrollTo(0,0);hud();if(i==4)lab()}
/* ===== kuis generik ===== */
const ok=(x,a)=>x.m?a==1:a===x.a;
function quiz(id,items){QS[id]=items;S.q[id]=S.q[id]||[];return`<div id="q_${id}">${rq(id)}</div>`}
function rq(id){return QS[id].map((x,i)=>{const a=S.q[id][i],d=a!=null;let h=`<div class=card><b>${i+1}. ${x.q}</b>`;
if(x.m){const bs=x.m.map(p=>p[1]).sort();h+=x.m.map((p,k)=>`<div class=row>${p[0]} → <select id="s${id}${i}_${k}" ${d?'disabled':''}><option value="">pilih…</option>${bs.map(b=>`<option>${b}</option>`).join('')}</select></div>`).join('')+(d?'':`<button class=btn onclick="chk('${id}',${i})">Periksa</button>`)}
else h+=x.o.map((o,j)=>`<button class="opt ${d?(j==x.a?'ok':j==a?'no':''):''}" ${d?'disabled':''} onclick="ans('${id}',${i},${j})">${o}</button>`).join('');
if(d)h+=`<div class="fb ${ok(x,a)?'g':'r'}">${ok(x,a)?'✅ Tepat! ':'❌ Belum tepat. '}${x.e}</div>`;return h+'</div>'}).join('')+(id=='f'?fin():'')}
function ans(id,i,j){S.q[id][i]=j;if(ok(QS[id][i],j))A(id+i,10);$('#q_'+id).innerHTML=rq(id);hud()}
function chk(id,i){const x=QS[id][i];const r=x.m.every((p,k)=>$(`#s${id}${i}_${k}`).value==p[1]);S.q[id][i]=r?1:0;if(r)A(id+i,10);$('#q_'+id).innerHTML=rq(id);hud()}
function fin(){const a=S.q.f;if(a.filter(v=>v!=null).length<10)return`<div class="card m">Jawab semua soal untuk melihat hasil akhir (${a.filter(v=>v!=null).length}/10).</div>`;
const w={};QS.f.forEach((x,i)=>{if(!ok(x,a[i]))w[x.t]=1});const n=QS.f.filter((x,i)=>ok(x,a[i])).length;const rec=Object.keys(w);
return`<div class=card><h2>Skor: ${n*10}/100</h2><p>${n>=8?'🎉 Hebat! Pemahamanmu sudah kuat.':n>=6?'👍 Bagus! Sedikit lagi untuk menguasai.':'💪 Tetap semangat! Ulangi misi yang disarankan.'}</p>${rec.length?`<b>Perlu dipelajari lagi:</b><ul>${rec.map(r=>`<li>${r}</li>`).join('')}</ul>`:'<b>Semua topik sudah dikuasai!</b>'}<button class=btn onclick="S.q.f=[];Object.keys(S.pts).filter(k=>k.startsWith('f')).forEach(k=>delete S.pts[k]);go(6)">↻ Ulangi Kuis</button></div>`}
/* ===== mesin SQL simulasi ===== */
let DB,LR;const SEED=()=>[[101,'Ayu','X.1',85],[102,'Bima','X.2',72],[103,'Citra','X.1',90],[104,'Dimas','X.3',68],[105,'Eka','X.2',78]];
function init(){DB={murid:{cols:['nis','nama','kelas','nilai'],rows:SEED()}};LR=null}init();
const V=s=>{s=s.trim();return/^'.*'$/.test(s)?s.slice(1,-1):isNaN(s)?s:+s};
function tb(n){const t=DB[n.toLowerCase()];if(!t)throw`Tabel "${n}" tidak ditemukan. Periksa nama tabel.`;return t}
function cnd(t,w){if(!w)return()=>true;const ps=w.split(/\s+and\s+/i).map(p=>{const k=p.trim().match(/^(\w+)\s*(>=|<=|!=|=|>|<)\s*(.+)$/);if(!k)throw`Syarat WHERE belum benar. Contoh: WHERE kelas = 'X.1'`;const i=t.cols.indexOf(k[1].toLowerCase());if(i<0)throw`Kolom "${k[1]}" tidak ada. Kolom tersedia: ${t.cols.join(', ')}`;return[i,k[2],V(k[3])]});
return r=>ps.every(([i,o,v])=>{const a=r[i];return o=='='?a==v:o=='!='?a!=v:o=='>'?a>v:o=='<'?a<v:o=='>='?a>=v:a<=v})}
function run(q){q=q.trim().replace(/;$/,'');let m;LR=null;
if(m=q.match(/^create table (\w+)\s*\((.+)\)$/is)){const c=m[2].split(',').map(s=>s.trim().split(/\s+/)[0].toLowerCase());DB[m[1].toLowerCase()]={cols:c,rows:[]};return`✅ Tabel "${m[1]}" dibuat dengan kolom: ${c.join(', ')}`}
if(m=q.match(/^insert into (\w+)\s*(?:\(([^)]*)\))?\s*values\s*\((.+)\)$/is)){const t=tb(m[1]),v=(m[3].match(/'[^']*'|[^,]+/g)||[]).map(V),cs=m[2]?m[2].split(',').map(s=>s.trim().toLowerCase()):t.cols;if(v.length!=cs.length)throw`Jumlah nilai (${v.length}) harus sama dengan jumlah kolom (${cs.length}).`;const r=t.cols.map(c=>{const i=cs.indexOf(c);return i<0?null:v[i]});if(t.rows.some(x=>x[0]==r[0]))throw`Primary key ${t.cols[0]}=${r[0]} sudah ada! Primary key tidak boleh sama.`;t.rows.push(r);return'✅ 1 baris ditambahkan.'}
if(m=q.match(/^select\s+(.+?)\s+from\s+(\w+)(?:\s+where\s+(.+))?$/is)){const t=tb(m[2]),f=cnd(t,m[3]),cs=m[1].trim()=='*'?t.cols:m[1].split(',').map(s=>s.trim().toLowerCase());const ix=cs.map(c=>{const i=t.cols.indexOf(c);if(i<0)throw`Kolom "${c}" tidak ada. Kolom tersedia: ${t.cols.join(', ')}`;return i});LR={cols:cs,rows:t.rows.filter(f).map(r=>ix.map(i=>r[i]))};return`✅ SELECT berhasil: ${LR.rows.length} baris ditemukan.`}
if(m=q.match(/^update\s+(\w+)\s+set\s+(.+?)(?:\s+where\s+(.+))?$/is)){const t=tb(m[1]),f=cnd(t,m[3]),sets=m[2].split(/,(?=\s*\w+\s*=)/).map(s=>{const k=s.match(/^\s*(\w+)\s*=\s*(.+)$/);const i=t.cols.indexOf(k&&k[1].toLowerCase());if(i<0)throw'Bagian SET belum benar. Contoh: SET nilai = 90';return[i,V(k[2])]});let n=0;t.rows.forEach(r=>{if(f(r)){sets.forEach(([i,v])=>r[i]=v);n++}});return`✅ ${n} baris diubah.`+(m[3]?'':' ⚠️ Tanpa WHERE, SEMUA baris berubah!')}
if(m=q.match(/^delete from\s+(\w+)(?:\s+where\s+(.+))?$/is)){const t=tb(m[1]),f=cnd(t,m[2]),b=t.rows.length;t.rows=t.rows.filter(r=>!f(r));return`✅ ${b-t.rows.length} baris dihapus.`+(m[2]?'':' ⚠️ Tanpa WHERE, SEMUA baris terhapus!')}
throw'Perintah belum dikenali. Awali dengan CREATE TABLE, INSERT INTO, SELECT, UPDATE, atau DELETE FROM. Periksa ejaan dan tanda kutip.'}
const T=(c,r)=>`<div class=sc><table><tr>${c.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(v=>`<td>${v??''}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${c.length} class=m>(tabel kosong)</td></tr>`}</table></div>`;
/* ===== laboratorium ===== */
const CH=[['Tambahkan murid baru dengan nis 106 (INSERT).',()=>DB.murid.rows.some(r=>r[0]==106),['Gunakan INSERT INTO murid VALUES (...)','Urutan nilai: nis, nama, kelas, nilai. Teks diapit tanda kutip tunggal.']],
['Temukan semua data murid dari kelas X.1.',()=>LR&&LR.cols.includes('kelas')&&LR.rows.length==2&&LR.rows.every(r=>r[LR.cols.indexOf('kelas')]=='X.1'),['Gunakan SELECT * FROM murid ...','Tambahkan syarat WHERE kelas = \'X.1\'']],
['Tampilkan hanya nama murid yang nilainya ≥ 80.',()=>LR&&LR.cols.join()=='nama'&&LR.rows.map(r=>r[0]).sort().join()=='Ayu,Citra',['Pilih kolom nama saja: SELECT nama FROM murid','WHERE nilai >= 80']],
['Ubah nilai murid nis 102 menjadi 90 (UPDATE).',()=>DB.murid.rows.some(r=>r[0]==102&&r[3]==90),['UPDATE murid SET nilai = 90 ...','Jangan lupa WHERE nis = 102 agar hanya satu baris berubah.']],
['Hapus data murid nis 105 (DELETE).',()=>!DB.murid.rows.some(r=>r[0]==105),['DELETE FROM murid ...','WHERE nis = 105 — tanpa WHERE semua data hilang!']]];
function lab(){$('#lt').innerHTML=T(DB.murid.cols,DB.murid.rows)+`<p class=m>${DB.murid.rows.length} record</p>`;$('#lr').innerHTML=LR?'<b>Hasil SELECT:</b>'+T(LR.cols,LR.rows):'';
$('#lc').innerHTML=CH.map((c,i)=>{const d=S.pts['m4'+i];return`<div class=row>${d?'✅':'⬜'} <b>${i+1}.</b> ${c[0]} <button class="btn g" onclick="hint(${i})">💡</button><div class=m id=h${i}>${S.h[i]?c[2].slice(0,S.h[i]).join(' · '):''}</div></div>`}).join('')}
function hint(i){S.h[i]=Math.min(2,(S.h[i]||0)+1);lab()}
function exe(){let msg;try{msg=run($('#sql').value)}catch(e){msg='❌ '+e;LR=null}$('#lm').innerHTML=msg;CH.forEach((c,i)=>{if(!msg.startsWith('❌')&&c[1]())A('m4'+i,20)});lab();hud()}
function rst(){init();$('#lm').innerHTML='Data dikembalikan ke awal.';lab()}
/* ===== puzzle SQL ===== */
const PZ=[["SELECT nama FROM murid WHERE kelas = 'X.1'","Menampilkan nama murid kelas X.1"],["INSERT INTO murid VALUES (106, 'Fajar', 'X.3', 80)","Menambah murid baru"],["UPDATE murid SET nilai = 90 WHERE nis = 102","Mengubah nilai murid nis 102"]];
const pz=i=>S.pz[i]=S.pz[i]||{p:[],o:PZ[i][0].split(' ').map((t,k)=>[t,k]).sort((a,b)=>((a[1]*5+3)%7)-((b[1]*5+3)%7)||a[1]-b[1])};
function rpz(i){const z=pz(i);return`<div class=card><b>Susun: ${PZ[i][1]}</b><pre>${z.p.map(k=>z.o[k][0]).join(' ')||'…'}</pre>${z.o.map((t,k)=>`<button class=tok ${z.p.includes(k)?'disabled':''} onclick="pick(${i},${k})">${t[0]}</button>`).join('')}<div><button class="btn g" onclick="S.pz[${i}]&&(S.pz[${i}].p=[]);rp(${i})">Ulang</button><button class=btn onclick="cpz(${i})">Periksa</button></div><div id=pf${i} class=m></div></div>`}
function pick(i,k){pz(i).p.push(k);rp(i)}function rp(i){$('#pz'+i).innerHTML=rpz(i)}
function cpz(i){const z=pz(i),s=z.p.map(k=>z.o[k][0]).join(' '),r=s==PZ[i][0];if(r)A('m3p'+i,10);$('#pf'+i).innerHTML=r?'✅ Benar! Urutan perintah tepat.':'❌ Belum tepat. Petunjuk: '+(s.split(' ')[0]!=PZ[i][0].split(' ')[0]?'perhatikan kata pertama (jenis perintah).':'periksa urutan kata kunci dan syarat WHERE.');hud()}
/* ===== konten ===== */
const sel=(id,o)=>`<select id="${id}"><option value="">pilih…</option>${o.map(x=>`<option>${x}</option>`).join('')}</select>`;
const MT=[['Data','Fakta mentah, belum diolah (mis. angka 85)'],['Informasi','Hasil olahan data yang bermakna (mis. "Ayu lulus")'],['Basis data','Kumpulan data terorganisir yang saling berhubungan'],['DBMS','Perangkat lunak pengelola basis data']];
function mt(){const r=MT.every((m,i)=>$('#mt'+i).value==m[1]);$('#mtf').innerHTML=r?'✅ Semua cocok! +20 poin':'❌ Masih ada yang keliru. Ingat: data = mentah, informasi = sudah bermakna.';if(r)A('m1mt',20);hud()}
const IF=[['nis','Kolom/field nis: menyimpan nomor induk. Tipe data INTEGER. Tiap murid punya nis unik, sehingga cocok jadi PRIMARY KEY.'],['nama','Field nama: menyimpan teks. Tipe data TEXT. Bisa sama antar murid, jadi tidak cocok jadi primary key.'],['kelas','Field kelas: teks seperti X.1. Banyak murid memiliki kelas sama.'],['nilai','Field nilai: angka. Tipe data INTEGER atau REAL (desimal).']];
function info(k){$('#inf').innerHTML=k[0]=='r'?`<b>Record (baris) ke-${k[1]+1}</b>: satu data lengkap tentang satu murid → ${SEED()[k[1]].join(' | ')}`:`<b>Field (kolom) ${IF[k[1]][0]}</b>: ${IF[k[1]][1]}`;A('m2i',10);hud()}
const CMD=[['CREATE TABLE','Membuat tabel baru',"CREATE TABLE murid (\n nis INTEGER PRIMARY KEY,\n nama TEXT, kelas TEXT, nilai INTEGER);","Tabel 'murid' dengan 4 kolom terbentuk (masih kosong)."],['INSERT','Menambah data (Create)',"INSERT INTO murid\nVALUES (101,'Ayu','X.1',85);","1 baris baru:\n101 | Ayu | X.1 | 85"],['SELECT','Menampilkan data (Read)',"SELECT nama FROM murid\nWHERE kelas = 'X.1';","nama\n-----\nAyu\nCitra"],['UPDATE','Mengubah data (Update)',"UPDATE murid SET nilai = 90\nWHERE nis = 101;","Nilai Ayu berubah 85 → 90"],['DELETE','Menghapus data (Delete)',"DELETE FROM murid\nWHERE nis = 105;","Baris nis 105 hilang dari tabel"]];
const FQ=[{q:'Apa yang dimaksud dengan basis data?',o:['Kumpulan data terorganisir yang mudah dicari dan dikelola','Satu file gambar','Program untuk mengetik','Kabel jaringan'],a:0,e:'Basis data menyimpan data secara terstruktur agar mudah dicari, diubah, dan tidak tertukar.',t:'Konsep dasar basis data (Misi 1)'},
{q:'Benar atau salah: "Data dan informasi artinya sama persis."',o:['Benar','Salah'],a:1,e:'Data adalah fakta mentah, sedangkan informasi adalah data yang sudah diolah sehingga bermakna.',t:'Konsep dasar basis data (Misi 1)'},
{q:'Dalam tabel, kolom disebut juga…',o:['Record','Field','Query','Server'],a:1,e:'Kolom = field (atribut), misalnya nama atau kelas. Baris = record.',t:'Struktur tabel (Misi 2)'},
{q:'Satu baris lengkap data satu murid disebut…',o:['Field','Tabel','Record','Kunci'],a:2,e:'Record adalah satu baris berisi data lengkap satu objek.',t:'Struktur tabel (Misi 2)'},
{q:'Kolom terbaik sebagai primary key pada tabel buku perpustakaan adalah…',o:['judul','pengarang','kode_buku','tahun_terbit'],a:2,e:'Primary key harus unik dan tidak kosong. Judul atau pengarang bisa sama, kode_buku unik.',t:'Primary key (Misi 2)'},
{q:'Tipe data paling tepat untuk kolom tanggal_lahir adalah…',o:['INTEGER','DATE','BOOLEAN','Gambar'],a:1,e:'Tanggal disimpan dengan tipe DATE agar bisa diurutkan dan dihitung.',t:'Tipe data (Misi 2)'},
{q:'Perintah SQL untuk menampilkan data adalah…',o:['INSERT','SELECT','DELETE','CREATE'],a:1,e:'SELECT = Read pada CRUD, untuk menampilkan data.',t:'SQL dasar (Misi 3)'},
{q:'Kasus: UPDATE murid SET nilai = 90; (tanpa WHERE). Apa akibatnya?',o:['Hanya murid pertama berubah','Semua murid bernilai 90','Perintah gagal','Tidak ada yang berubah'],a:1,e:'Tanpa WHERE, perubahan berlaku untuk semua baris. Selalu periksa syarat WHERE!',t:'SQL dasar (Misi 3)'},
{q:'Cocokkan perintah SQL dengan operasi CRUD',m:[['INSERT','Create'],['SELECT','Read'],['UPDATE','Update'],['DELETE','Delete']],e:'INSERT=Create, SELECT=Read, UPDATE=Update, DELETE=Delete.',t:'Operasi CRUD (Misi 4)'},
{q:'Benar atau salah: "Untuk latihan, boleh memakai data asli teman tanpa izin."',o:['Benar','Salah'],a:1,e:'Data pribadi harus dilindungi. Gunakan data fiktif dan minta izin bila perlu.',t:'Etika & privasi data'}];
const rub=[['Identifikasi masalah','Jelas, nyata, relevan','Jelas','Kurang jelas','Belum ada'],['Rancangan tabel (kolom, PK, tipe)','Lengkap & tepat','Sebagian kecil keliru','Banyak keliru','Belum ada'],['Perintah SQL (min. 3)','≥3 benar & berjalan','3 dengan 1 kesalahan','<3 benar','Belum ada'],['Data fiktif & etika privasi','Fiktif, ada catatan privasi','Fiktif','Ada data asli','—'],['Pengujian & presentasi','Runtut, manfaat jelas','Cukup jelas','Kurang runtut','Belum ada']];
const P=[
()=>`<div class=hero><div class=pc>🕵️💾</div><h1>DATABASE ADVENTURE</h1><p>Misi Menjadi Ahli Basis Data</p><small style="color:#e6e0ff">Koding &amp; KA · Fase E · Kelas X SMA</small><br><br><button class=btn style="background:#fff;color:#4b2fc4" onclick="go(1)">🚀 Mulai Petualangan</button></div>
<div class=card><h3>🤔 Pertanyaan Pemantik</h3><p>Bagaimana sekolah menyimpan ribuan data murid agar mudah dicari dan tidak tertukar?</p></div>
<div class=card><h3>🎯 Misimu: jadi detektif data</h3><p>Kamu akan membangun sistem basis data sekolah lewat 5 misi, lalu menghadapi kuis akhir.</p><ul><li>Menjelaskan pengertian, manfaat, dan contoh basis data</li><li>Mengenal tabel, field, record, primary key, tipe data</li><li>Membedakan data–informasi dan memahami DBMS</li><li>Merancang tabel dan melakukan CRUD dengan SQL</li><li>Membuat proyek kelompok yang aman dan menjaga privasi</li></ul><small>Semua data dalam media ini fiktif.</small></div>`,
()=>`<h2>🔎 Misi 1 — Detektif Data</h2><div class=card><p>Basis data dipakai di <b>perpustakaan</b> (peminjaman buku), <b>nilai</b> (rapor), <b>absensi</b>, dan <b>data murid</b>. Bandingkan dua cara menyimpan data:</p><div class=two><div><b>❌ Berantakan</b><pre>ayu x1 85\nBima, kelas X.2 nilainya 72\n103 Citra X.1 90 (hadir)\nDimas?? 68</pre><small>Sulit dicari, format campur-campur.</small></div><div><b>✅ Tersusun dalam tabel</b>${T(['nis','nama','kelas','nilai'],SEED().slice(0,3))}<small>Rapi, mudah dicari &amp; diurutkan.</small></div></div></div>
<div class=card><h3>🧩 Cocokkan istilah</h3>${MT.map((m,i)=>`<div class=row><b>${m[0]}</b> → ${sel('mt'+i,MT.map(x=>x[1]).sort())}</div>`).join('')}<button class=btn onclick="mt()">Periksa</button><div id=mtf></div></div><h3>📝 Kuis Misi 1</h3>${quiz('m1',[{q:'Contoh BASIS DATA di sekolah adalah…',o:['Tumpukan kertas acak','Tabel absensi digital yang terstruktur','Foto kelas','Poster'],a:1,e:'Data tersusun rapi dalam tabel dapat dicari dan dikelola dengan mudah.'},{q:'Angka "85" saja disebut…',o:['Informasi','Data','DBMS','Tabel'],a:1,e:'Angka 85 adalah data mentah. Menjadi informasi bila diolah: "Nilai Ayu 85, lulus".'},{q:'Fungsi DBMS adalah…',o:['Mengedit video','Mengelola penyimpanan dan pengolahan basis data','Mencetak dokumen','Menghapus virus'],a:1,e:'DBMS (misalnya MySQL, SQLite) adalah perangkat lunak untuk membuat dan mengelola basis data.'}])}${NX(1)}`,
()=>`<h2>🏗️ Misi 2 — Struktur Basis Data</h2><div class=card><p>Ketuk <b>judul kolom</b> atau <b>nomor baris</b> pada tabel untuk melihat penjelasannya.</p><div class="sc cl"><table><tr><th>#</th>${IF.map((f,i)=>`<th onclick="info(['c',${i}])">${f[0]}</th>`).join('')}</tr>${SEED().slice(0,4).map((r,i)=>`<tr><td onclick="info(['r',${i}])"><b>▶${i+1}</b></td>${r.map(v=>`<td onclick="info(['r',${i}])">${v}</td>`).join('')}</tr>`).join('')}</table></div><div class=fb id=inf style="background:var(--bd)">Ketuk bagian tabel…</div><ul><li><b>Tabel</b>: kumpulan baris &amp; kolom</li><li><b>Field</b>: kolom · <b>Record</b>: baris</li><li><b>Primary key</b>: kolom unik penanda tiap record</li><li><b>Tipe data</b>: jenis isi kolom (INTEGER, TEXT, REAL, DATE)</li></ul></div>
<h3>🔑 Temukan Primary Key &amp; Tipe Data</h3>${quiz('m2',[{q:'Pada tabel murid (nis, nama, kelas, nilai), kolom mana primary key terbaik?',o:['nama','kelas','nis','nilai'],a:2,e:'nis unik untuk setiap murid. Nama, kelas, dan nilai bisa sama.'},{q:'Tipe data untuk kolom nama?',o:['INTEGER','TEXT','DATE','REAL'],a:1,e:'Nama berisi huruf, jadi bertipe TEXT.'},{q:'Tipe data untuk kolom jumlah_buku (1, 2, 3…)?',o:['TEXT','INTEGER','DATE','REAL'],a:1,e:'Bilangan bulat disimpan sebagai INTEGER.'},{q:'Tipe data untuk tanggal_pinjam?',o:['DATE','INTEGER','TEXT bebas','REAL'],a:0,e:'DATE membuat tanggal bisa diurutkan dan dihitung selisihnya.'}])}${NX(2)}`,
()=>`<h2>💻 Misi 3 — Menjadi Ahli SQL</h2><div class=card><p><b>SQL</b> (Structured Query Language) adalah bahasa untuk "berbicara" dengan basis data. Setiap perintah berakhir tanda titik koma (;).</p></div>${CMD.map(c=>`<div class=card><b>${c[0]}</b> — ${c[1]}<div class=two><div><small>Kode</small><pre>${c[2]}</pre></div><div><small>Hasil</small><pre>${c[3]}</pre></div></div></div>`).join('')}<h3>🧠 Susun perintah yang diacak</h3><small>Ketuk kata sesuai urutan.</small>${PZ.map((p,i)=>`<div id=pz${i}>${rpz(i)}</div>`).join('')}<div class=card>Mau mencoba menulis sendiri? Buka <b>Misi 4</b> — editor SQL berjalan langsung di browsermu.</div>${NX(3)}`,
()=>`<h2>🧪 Misi 4 — Laboratorium Pengolahan Data</h2><div class=card><b>Tabel murid (fiktif)</b><div id=lt></div><div id=lr></div></div><div class=card><b>Editor SQL</b><textarea id=sql rows=3 placeholder="Contoh: SELECT * FROM murid;">SELECT * FROM murid;</textarea><button class=btn onclick="exe()">▶ Jalankan</button><button class="btn g" onclick="rst()">↺ Reset data</button><div id=lm class=fb style="background:var(--bd)">Tulis perintah, lalu jalankan.</div></div><div class=card><b>Tantangan</b> <small>(+20 poin tiap tantangan)</small><div id=lc></div></div>${NX(4)}`,
()=>`<h2>📦 Misi 5 — Proyek Mini Database Sekolah</h2><div class=card><p>Kerjakan <b>berkelompok</b> (3–4 murid). Pilih satu: <i>Sistem absensi · Perpustakaan · Nilai murid · Inventaris lab komputer.</i></p><ol><li>Identifikasi masalah</li><li>Tentukan tabel, kolom, primary key, tipe data</li><li>Isi data contoh <b>fiktif</b></li><li>Tulis minimal 3 perintah SQL</li><li>Uji (tambah, tampil, ubah, hapus)</li><li>Presentasikan hasil dan manfaatnya</li></ol></div>
<div class=card><h3>Template Proyek</h3>${sel('pj',['Sistem absensi murid','Sistem perpustakaan sekolah','Sistem nilai murid','Sistem inventaris lab komputer'])}${[['pm','Masalah yang ingin diselesaikan'],['pt','Rancangan tabel: nama_tabel(kolom tipe, … PK)'],['pd','Data contoh (fiktif)'],['ps','Perintah SQL (min. 3)'],['pu','Hasil pengujian'],['pb','Manfaat basis data']].map(f=>`<div class=row><small>${f[1]}</small><textarea id=${f[0]} rows=2></textarea></div>`).join('')}<button class=btn onclick="sm()">Buat Ringkasan</button><textarea id=pr rows=6 placeholder="Ringkasan proyek muncul di sini — salin untuk dikumpulkan."></textarea></div>
<div class=card><h3>✅ Daftar Periksa</h3>${['Masalah jelas','Tabel, PK, tipe data lengkap','Data 100% fiktif','Minimal 3 SQL diuji','Siap presentasi','Tidak ada data pribadi nyata'].map(x=>`<label style="display:block;margin:4px 0"><input type=checkbox style="width:auto" onchange="ckl()"> ${x}</label>`).join('')}<div id=cf class=m></div></div>
<div class=card><h3>Rubrik Penilaian</h3><div class=sc><table><tr><th>Aspek</th><th>4</th><th>3</th><th>2</th><th>1</th></tr>${rub.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div><small>Skor akhir = jumlah/20 × 100.</small></div>${NX(5)}`,
()=>`<h2>🏆 Tantangan Master Database</h2>${quiz('f',FQ)}${NX(6)}`,
()=>`<h2>✍️ Refleksi &amp; Penutup</h2><div class=card>${['Apa konsep baru yang saya pahami?','Aktivitas mana yang paling membantu saya belajar?','Apa kesulitan saya ketika menggunakan SQL?','Bagaimana basis data membantu kehidupan sehari-hari?'].map(x=>`<div class=row><b>${x}</b><textarea rows=2></textarea></div>`).join('')}<button class=btn onclick="bd()">Lihat Lencanaku</button></div><div id=bg></div>`,
()=>`<h2>👩‍🏫 Modul Guru</h2><div class=card><details open><summary>Alur 3 pertemuan × 2 JP</summary><ul><li><b>Pertemuan 1:</b> diagnostik, pemantik, Misi 1 &amp; 2</li><li><b>Pertemuan 2:</b> Misi 3 &amp; 4 (praktik SQL)</li><li><b>Pertemuan 3:</b> Misi 5 proyek, presentasi, kuis akhir, refleksi</li></ul><b>Sebelum:</b> uji tautan, siapkan perangkat, bentuk kelompok heterogen. <b>Selama:</b> keliling, beri petunjuk bertahap. <b>Sesudah:</b> kumpulkan ringkasan proyek, diskusi refleksi.</details>
<details><summary>Asesmen diagnostik</summary><ol><li>Sebutkan 2 contoh data di sekolah.</li><li>Bagaimana mencari satu murid dari 1.000 data?</li><li>Apa beda data dan informasi? (lisan/kartu)</li></ol></details>
<details><summary>Asesmen formatif</summary>Kuis Misi 1–2, puzzle SQL, tantangan Lab (poin otomatis), daftar periksa proyek.</details>
<details><summary>Asesmen sumatif</summary>Kuis akhir 10 soal (kunci: 1-A, 2-Salah, 3-Field, 4-Record, 5-kode_buku, 6-DATE, 7-SELECT, 8-Semua bernilai 90, 9-INSERT/Create dst., 10-Salah) + proyek dinilai dengan rubrik Misi 5 (nilai = skor/20×100).</details>
<details><summary>Tindak lanjut</summary><b>Remedial:</b> ulangi Misi 2–4 dengan teman sebaya, kerjakan kuis dengan petunjuk. <b>Pengayaan:</b> tambah tabel kedua (mis. kelas), perintah ORDER BY dan COUNT, desain relasi antar tabel, diskusi keamanan data.</details>
<details><summary>Cara menyematkan di Google Sites</summary>Publikasikan halaman ini, salin tautannya. Di Google Sites: <b>Sisipkan → Sematkan → Menurut URL</b>, tempel tautan, atur ukuran penuh. Alternatif: unggah file HTML ke hosting sendiri lalu sematkan, atau bagikan tautannya. Tidak butuh server; basis data berupa simulasi di browser, jadi data tidak tersimpan setelah halaman ditutup (murid mengumpulkan ringkasan proyek).</details></div>`];
function sm(){const g=i=>$('#'+i).value;$('#pr').value=`PROYEK: ${g('pj')||'-'}\nMasalah: ${g('pm')}\nTabel: ${g('pt')}\nData fiktif: ${g('pd')}\nSQL: ${g('ps')}\nPengujian: ${g('pu')}\nManfaat: ${g('pb')}`;$('#pr').select()}
function ckl(){const c=[...document.querySelectorAll('input[type=checkbox]')];if(c.every(x=>x.checked)){A('m5c',30);$('#cf').textContent='🎉 Semua langkah proyek lengkap! +30 poin'}hud()}
function bd(){const d=DN(),L=[['m1','Detektif Data'],['m2','Arsitek Tabel'],['m3','Penyihir SQL'],['m4','Master Laboratorium'],['m5','Pemimpin Proyek']],q=sum('f')>=80,n=Object.values(d).filter(x=>x).length+(q?1:0);
$('#bg').innerHTML=`<div class=card>${L.map(l=>`<span class="badge ${d[l[0]]?'on':''}">${d[l[0]]?'🏅':'🔒'} ${l[1]}</span>`).join('')}<span class="badge ${q?'on':''}">${q?'🏅':'🔒'} Master Kuis</span><h3>${n>=6?'🌟 Master Database':n>=4?'💎 Ahli Basis Data':n>=2?'🔎 Detektif Data':'🧭 Penjelajah Data'}</h3><p>Lencana didasarkan pada capaian belajarmu, bukan kecepatan. Total poin: ${sum('')}. Lengkapi misi yang masih terkunci untuk naik level!</p></div>`}
go(0);
</script></body></html>
